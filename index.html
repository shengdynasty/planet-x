<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planet X</title>
<link rel="icon" href="data:,">
<meta name="description" content="Search NASA SPHEREx's six-monthly all-sky survey for the slow drift a distant Planet X would leave.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Same design system as app/css/base.css: UI is strictly black / white / grey; only imagery has colour.
   The homepage commits to the dark look, since it sits on the sky. */
:root {
  color-scheme: dark;
  --bg: #000; --panel: rgba(0,0,0,.64); --edge: rgba(255,255,255,.14);
  --ink: #f2f2f2; --ink-2: #a0a0a0; --ink-3: #6a6a6a; --fill: #f2f2f2; --fill-ink: #000;
  --font: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --gutter: clamp(16px, 4vw, 48px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
.glass { background: var(--panel); border: 1px solid var(--edge); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

.hero { position: relative; min-height: 100svh; display: grid; align-items: end; overflow: hidden; isolation: isolate; }
.hero .sky { position: absolute; inset: -4%; z-index: -2; background: #000 url("app/assets/sky_2k.jpg") 38% 50% / cover no-repeat; transform: scale(1.04); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.1) 35%, rgba(0,0,0,.5) 75%, rgba(0,0,0,.85) 100%); }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: var(--gutter);
  padding-block: calc(64px + env(safe-area-inset-top, 0px)) calc(clamp(56px, 12vh, 128px) + env(safe-area-inset-bottom, 0px)); }
.eyebrow { font-size: 12px; color: var(--ink-2); letter-spacing: .02em; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; }
.eyebrow i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--ink-2); }
h1 { font-size: clamp(40px, 7.4vw, 88px); line-height: 1.02; letter-spacing: -.035em; font-weight: 600; margin: 20px 0 36px; max-width: 13ch; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; text-decoration: none; line-height: 1;
  padding: 13px 18px; border-radius: 8px; border: 1px solid var(--edge); color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--fill); color: var(--fill-ink); border-color: transparent; }
.btn.primary:hover { background: #fff; }
</style>
</head>
<body>
<main class="hero">
  <div class="sky" aria-hidden="true"></div>
  <div class="wrap">
    <span class="eyebrow glass"><i aria-hidden="true"></i>NASA Space Apps 2026 · Planet X and SPHEREx</span>
    <h1>Find the planet that barely moves.</h1>
    <div class="ctas">
      <a class="btn primary" href="app/">Open the sky <span aria-hidden="true">→</span></a>
      <a class="btn glass" href="artifacts/moving-sky/">Moving Sky demo</a>
    </div>
  </div>
</main>
</body>
</html>
